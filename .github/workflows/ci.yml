name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - master
      - release

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10.12']

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m venv e3gnn4matrix-venv
        source e3gnn4matrix-venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]

    - name: Run unit tests on develop (non-blocking)
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      continue-on-error: true
      run: |
        source e3gnn4matrix-venv/bin/activate
        pytest --cov=./ --cov-report=xml -m "unit"

    - name: Run all tests on master and PRs
      if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || (github.event_name == 'pull_request')
      run: |
        source e3gnn4matrix-venv/bin/activate
        pytest --cov=./ --cov-report=xml

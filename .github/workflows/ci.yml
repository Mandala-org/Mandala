name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *' # Run at midnight every day

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Fetch all history for all tags and branches
        lfs: true # Checkout LFS files

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m venv e3gnn4matrix-venv
        source e3gnn4matrix-venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .[dev]

    - name: Run unit tests
      if: github.event_name == 'push'
      run: |
        source e3gnn4matrix-venv/bin/activate
        pytest --cov=./ --cov-report=xml -m unit

    - name: Run integration and physics tests
      if: github.event_name == 'schedule'
      run: |
        source e3gnn4matrix-venv/bin/activate
        pytest --cov=./ --cov-report=xml -m "integration or physics"

    - name: Run all tests
      if: github.event_name == 'pull_request'
      run: |
        source e3gnn4matrix-venv/bin/activate
        pytest --cov=./ --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

name: Documentation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One build per ref; a newer push to the same branch supersedes the older build.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the two published figures used by Sphinx
        # Fetch only these images, not the multi-gigabyte scientific datasets.
        run: >-
          git lfs pull
          --include="paper/figures/results/silicon_cif_scaling_time_total.png,paper/figures/results/paper_zncusnses_hamiltonian_correlation.png"
          --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create virtual environment
        run: |
          uv venv --python 3.10 --seed .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv-ci" >> "$GITHUB_ENV"
      - name: Install CPU torch and matching PyG wheels
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: torch-scatter==2.1.2 torch-geometric==2.7.0 -f https://data.pyg.org/whl/torch-2.5.1+cpu.html
      - name: Install package and documentation dependencies
        run: |
          python -m pip install -e '.[docs]'
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Build HTML
        run: python -m sphinx -E -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    # Only the Pages deployment itself must be serialized.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4

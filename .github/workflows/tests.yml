name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.experimental && 25 || 45 }}
    # Newer interpreters are observational until CI history is established.
    continue-on-error: ${{ matrix.experimental || matrix.python-version == '3.11' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            torch-version: '2.5.1'
            experimental: false
          - python-version: '3.11'
            torch-version: '2.5.1'
            experimental: false
          - python-version: '3.13'
            torch-version: '2.7.1'
            experimental: true
          - python-version: '3.14'
            torch-version: '2.11.0'
            experimental: true
    env:
      PYTHONPATH: src:.
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
      WANDB_MODE: offline
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        # Keep LFS pointers: the CI selection below excludes external data.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Create virtual environment
        run: |
          uv venv --python '${{ matrix.python-version }}' --seed .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv-ci" >> "$GITHUB_ENV"
      - name: Install CPU torch and matching PyG wheels
        run: |
          python -m pip install --upgrade pip wheel
          # Exact CPU wheels exist for each interpreter and matching extension.
          python -m pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=:all: torch-scatter==2.1.2 torch-geometric==2.7.0 -f https://data.pyg.org/whl/torch-${{ matrix.torch-version }}+cpu.html
      - name: Install package metadata
        env:
          PIP_IGNORE_REQUIRES_PYTHON: ${{ matrix.python-version == '3.11' && '1' || '0' }}
        # Bypass the Python pin for MANDALA alone. Ignoring it for dependencies
        # too would select releases requiring newer Python (e.g. SciPy sdists).
        run: python -m pip install --no-deps -e '.[dev]'
      - name: Install test dependencies
        run: |
          python - <<'PY' > .venv-ci/test-requirements.txt
          from importlib.metadata import requires
          from packaging.requirements import Requirement

          for text in requires('mandala'):
              requirement = Requirement(text)
              if requirement.marker is None or requirement.marker.evaluate({'extra': 'dev'}):
                  requirement.marker = None
                  print(requirement)
          PY
          python -m pip install -r .venv-ci/test-requirements.txt
      - name: Check test collection
        run: python -m pytest --collect-only -q
      - name: Unit, physics and equivariance tests with line coverage
        # Four workers fit hosted runners; local validation also uses -n 16.
        # Exclude GPU, network, large data, slow, integration and workflow tests.
        # OpenMX parser/rotation files require 169 MB of H2O LFS matrices;
        # info-parser tests also require LFS, spatial tests use 745 MB of Si,
        # and PySCF rotation tests require separately generated baseline data.
        # Data-backed Snapshot and structure-inference tests carry large_data.
        # Optional live upstream source comparisons retain explicit pytest skips.
        run: |
          time python -m pytest -n 4 tests/unit tests/physics tests/equivariance \
            -m 'not (gpu or large_data or network or slow or integration or workflow)' \
            --ignore=tests/unit/data/test_openmx_parser.py \
            --ignore=tests/unit/data/test_openmx_info_parser.py \
            --ignore=tests/unit/data/test_snapshot_spatial.py \
            --ignore=tests/physics/test_rotation_reference_files.py \
            --ignore=tests/physics/test_pyscf_rotation_reference_files.py \
            --cov=src --cov-report=term-missing --durations=20 -ra

species:
  ordering: atomic_number
symmetrize_hamiltonian_targets: false
symmetrize_overlap_targets: false
symmetrize_density_targets: false
symmetrize_validation_output: false
apply_cutoff_to_targets: false
schema_version: 1
codec:
  spinful: false
parameters:
  width: 4
  radial_width: 8
data:
  representation: packed_shells
  basis: openmx
  geometry_dtype: float64
  validate_hermitian: false
  validate_support: false
  canonicalize_edges: false
  target_frame: global
  local_coordinates: false
objective:
  kind: mse
  epoch_weight: edges
optimization:
  optimizer:
    kind: adam
    lr: 0.002
  scheduler: null
training:
  dtype: float32
  seed: 42
  batch_size: 1
  max_epochs: 3000
pipeline:
  block_libraries: [deeph_e3, mace]
  blocks:
    attention_update:
      summary: Gated convolution of endpoint features with attention aggregation
      inputs: [node, edge, edge_index, harmonics, radial]
      outputs: [out]
      options: {irreps_out: null}
      stages:
      - {id: pre, transform: e3mlp, inputs: [node], outputs: [pre], options: {variant: basic}}
      - {id: gather, transform: endpoint_concat, inputs: [pre, edge, edge_index], outputs: [gathered]}
      - id: convolution
        transform: equivariant_convolution
        inputs: [gathered, harmonics, radial]
        outputs: [messages]
        options: {irreps_out: $irreps_out, radial_layers: [8]}
      - id: aggregate
        transform: projected_attention
        inputs: [messages, pre, radial, edge_index]
        outputs: [aggregated]
        options: {scalar_dim: 4, heads: 2, variant: basic}
      - {id: post, transform: e3mlp, inputs: [aggregated], outputs: [update], options: {variant: basic}}
      - {id: activation, transform: irrep_nonlinearity, inputs: [update], outputs: [out]}
    pair_readout:
      summary: Per-role trunk and per species-pair projection to orbital irreps
      inputs: [node, edge, edge_index, partitions, roles]
      outputs: [out]
      stages:
      - {id: onsite, transform: onsite_from_nodes, inputs: [edge, node, edge_index, roles], outputs: [onsite]}
      - id: trunk
        transform: e3mlp
        inputs: [onsite, roles]
        outputs: [trunk]
        options: {variant: basic, activate_last: true}
      - id: project
        transform: pair_projection
        inputs: [trunk, partitions, roles]
        outputs: [out]
        options: {variant: basic}
  stages:
  - id: embedding
    transform: irrep_linear
    inputs:
    - node_one_hot
    outputs:
    - node_0
    options:
      irreps_out: 4x0e
  - id: radial
    transform: gaussian_basis
    inputs:
    - edge_lengths
    outputs:
    - radial
    options:
      start: 0.0
      stop: 7.2
      n_gaussians: 8
  - id: edge_embedding
    transform: irrep_linear
    inputs:
    - radial
    outputs:
    - edge_0
    options:
      irreps_out: 4x0e
  - id: angular
    transform: spherical_harmonics
    inputs:
    - edge_vectors
    outputs:
    - angular
    options:
      irreps: 0e+1o
  - id: density_radial
    transform: gaussian_basis
    inputs:
    - message_lengths
    outputs:
    - density_radial
    options:
      start: 0.0
      stop: 7.2
      n_gaussians: 8
  - id: density_angular
    transform: spherical_harmonics
    inputs:
    - message_vectors
    outputs:
    - density_angular
    options:
      irreps: 0e+1o
  - id: density
    transform: density_interaction
    inputs: [node_0, density_angular, density_radial, message_edge_index, node_batch]
    outputs: [density, density_message]
    options: {irreps_out: 4x0e+4x1o, radial_layers: [8], graph_norm: false, degree_scale: true, avg_num_neighbors: 2.0}
  - id: skip
    transform: species_tensor_product
    inputs: [node_0, node_one_hot]
    outputs: [skip]
    options: {irreps_out: 4x0e+4x1o}
  - id: products
    transform: symmetric_product
    inputs: [density, node_one_hot, skip]
    outputs: [node_product]
    options: {irreps_out: 4x0e+4x1o, correlation: 2}
  - id: attention
    transform: attention_update
    inputs:
    - node_product
    - edge_0
    - edge_index
    - angular
    - radial
    outputs:
    - node_attention
    options:
      irreps_out: 4x0e+4x1o
  - id: edge_update
    transform: e3_edge_update
    inputs: [node_attention, edge_one_hot, angular, edge_0, radial, edge_index, edge_batch]
    outputs: [edge_final]
    options: {irreps_out: 4x0e+4x1o}
  - id: roles
    transform: edge_roles
    inputs:
    - edge_index
    outputs:
    - roles
  - id: readout
    role: readout
    transform: pair_readout
    inputs:
    - node_attention
    - edge_final
    - edge_index
    - edge_partitions
    - roles
    outputs:
    - partitioned_vectors
  - id: orbital_pack
    role: readout
    transform: partitioned_blocks_to_shells
    inputs:
    - partitioned_vectors
    - edge_partitions
    outputs:
    - hamiltonian
    options:
      species_shells: ${species.shells}
      species_order: ${species.order}
  outputs:
    hamiltonian: hamiltonian

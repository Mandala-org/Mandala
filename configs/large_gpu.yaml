# configs/large_gpu.yaml
# Automatically generate 100 snapshots per temperature for train/val

run_name: "silicon_large_gpu"
wandb_project: "e3gnn_silicon"

# Base directory for snapshots: dataset_A/<temp>K/<index>
dataset_base_path: "/bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A"
# Temperatures for training and validation
train_temps: [300, 600, 1200, 1500, 1800, 2100, 2700, 3000]
val_temps:   [900, 2400]
# Number of snapshots per temperature
n_snapshots_per_temp: 100

# Data-processing hyper-parameters
cutoff_gnn:     5.0
cutoff_matrix:  7.5
l_max_sh:       3
n_radial:       64
num_workers:    8

# Optimizer and training
lr:           3e-4
max_epochs:   100
precision:    32
accum:        1

# Model hyper-parameters (defaults used unless overridden)
# model:
#   hidden_base_dim: 64
#   num_layers_gnn: 4
#   num_layers_matrix: 2

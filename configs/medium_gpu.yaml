    purpose: train
  - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1200K/0/Si_DM
    info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1200K/0/info.dat
    purpose: train
  - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1200K/1/Si_DM
    info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1200K/1/info.dat
    purpose: train
  - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1500K/0/Si_DM
    info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1500K/0/info.dat
    purpose: train
  - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1500K/1/Si_DM
    info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/1500K/1/info.dat

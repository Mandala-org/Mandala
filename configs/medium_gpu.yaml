  - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/2400K/1/Si_DM
    info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/2400K/1/info.dat
    purpose: val

# Data-processing hyper-parameters
cutoff_gnn:     5.0        # Å
cutoff_matrix:  7.5        # Å
l_max_sh:       3
n_radial:       64
num_workers:    8

# Optimizer and training
lr:           3e-4
max_epochs:   10
precision:    32
accum:        1


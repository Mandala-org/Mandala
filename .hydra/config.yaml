version_base: 1.1
data:
  snapshots: []
  cutoff_gnn: 5.0
  cutoff_matrix: 7.5
  l_max_sh: 3
  n_radial: 64
  num_workers: 4
model:
  l_max: 3
  hidden_base_dim: 64
  num_layers_gnn: 2
  num_layers_matrix: 1
  use_edge_updates: true
  use_self_update: true
  nonlin_kind: gate
  activation_scalar: silu
  batch_norm: false
  norm_kind: component
  dropout: 0.0
  residual_connections: true
  n_radial: 64
  radial_layers:
  - 128
  share_radial: true
  head_depth: 1
  head_hidden_mul: 1.0
  hidden_mul_clip: 4.0
  energy_loss_coef: 1.0e-05
  electron_loss_coef: 1.0e-05
training:
  seed: 42
  lr: 0.0001
  max_epochs: 30
  precision: 32
  log_every_n_steps: 4
  gpus: cpu
  tune: null
logging:
  verbosity: 2
  bench_verbosity: 2
  log_activation_mag: false
  wandb_project: null
  log_model: true
  save_dir: wandb
  run_name: null
presets:
  data:
    snapshots:
    - matrix: data/small/H2O/original/H2O.matrix
      info: data/small/H2O/original/H2O.info.out
      purpose: train
    - matrix: data/big/silicon/900K/Si_DM
      info: data/big/silicon/900K/info.txt
      purpose: train
    - matrix: data/big/silicon/2700K/Si_DM
      info: data/big/silicon/2700K/info.txt
      purpose: val
    cutoff_gnn: 4.0
    cutoff_matrix: 6.0
    l_max_sh: 2
    n_radial: 64
    num_workers: 0
  training:
    lr: 0.0003
    max_epochs: 3
    precision: 32
    gpus: cpu
  model:
    hidden_base_dim: 32
    num_layers_gnn: 2
    num_layers_matrix: 1
    dropout: 0.0
    energy_loss_coef: 0.0001
    electron_loss_coef: 0.0001
  logging:
    run_name: debug-cpu-small
    wandb_project: null

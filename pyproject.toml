[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e3gnn4matrix"
version = "0.0.1"
description = "E(3)-equivariant GNN for sparse DFT matrices"
dependencies = [
    "torch>=2.1",
    "e3nn>=0.5.6",
    "metatensor>=0.1.0",
    "ase>=3.22",
    "hydra-core>=1.3",
    "pytorch-lightning>=2.2",
    "wandb>=0.16",
    "tqdm>=4.66",
    "numpy>=1.26",
    "ray[tune]>=2.9",
    "nevergrad>=1.0",
    "optuna>=3.6",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "black>=24.3",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

# pyproject.toml
[tool.ruff]
# ignore E741 Ambiguous variable name
ignore = ["E741"]

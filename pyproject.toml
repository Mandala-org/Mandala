[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mandala"
version = "0.0.1"
description = "E(3)-equivariant GNN for sparse DFT matrices"
dependencies = [
    "torch>=2.1",
    "torch-scatter>=2.1",
    "e3nn>=0.5.6",
    "metatensor>=0.1.0",
    "ase>=3.22",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.2",
    "wandb>=0.16",
    "tqdm>=4.66",
    "numpy>=1.26",
    "pandas",
    "seaborn",
    "psutil",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.7.0",
    "black>=24.3",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

# pyproject.toml
[tool.ruff]
# (any other ruff settings that still belong at the top level,
#  e.g. version pinning, source-target, etc.)

[tool.ruff.lint]
# ignore E741 Ambiguous variable name
ignore = ["E741", "E402"]

[tool.pytest.ini_options]
addopts = ['-n', 'auto']
markers = [
    "unit: fast, isolated tests",
    "integration: slower workflow tests on real data",
    "physics: tests of physical constraints",
]

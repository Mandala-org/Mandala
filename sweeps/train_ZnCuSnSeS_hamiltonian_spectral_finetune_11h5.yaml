program: scripts/wandb_run.py
method: bayes
metric:
  name: val/hamiltonian_mae
  goal: minimize

project: mandala-ZnCuSnSeS-hamiltonian-spectral-finetune
name: ZnCuSnSeS-hamiltonian-spectral-finetune-11h5
command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}

parameters:
  # Experiment metadata
  wandb-project:
    value: mandala-ZnCuSnSeS-hamiltonian-spectral-finetune
  checkpoint-dir:
    value: /bigdata/casus/wdm/hamiltonian_learning/models/checkpoints/ZnCuSnSeS_hamiltonian_spectral_finetune_11h5
  resume-from-checkpoint:
    value: /bigdata/casus/wdm/hamiltonian_learning/models/checkpoints/ZnCuSnSeS_hamiltonian_envelope_stageA_selected_47h5/dandy-sweep-34-restart47h5/best_model.pt
  resume-mode:
    value: best
  compatibility:
    value: true
  wandb-mode:
    value: online
  generate-video:
    value: false
  log-artifacts:
    value: true

  # Dataset / time budget
  dataset-kind:
    value: ZnCuSnSeS
  data-path:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/ZnCuSnSeS
  snapshot-cache-dir:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/ZnCuSnSeS/snapshot_cache
  dataset-device:
    value: cuda
  num-workers:
    value: 3
  scales:
    value: [1]
  num-train-per-scale:
    value: 80
  num-val-per-scale:
    value: 20
  max-wall-clock-hours:
    value: 11.5

  # Optimization
  lr:
    distribution: log_uniform_values
    min: 5.0e-6
    max: 2.0e-3
  max_epochs:
    value: 30000
  grad-clip-val:
    values: [0.5, 1.0, 2.0]
  accumulate-grad-batches:
    values: [1, 2, 4]
  use-lr-scheduler:
    value: true
  lr-scheduler-factor:
    value: 0.5
  lr-scheduler-patience:
    values: [20, 40, 60]
  lr-scheduler-min-lr:
    value: 1e-8
  lr-scheduler-target:
    value: val/loss_total

  # Core architecture
  precision:
    value: 32-true
  convention:
    value: e3nn
  cutoff-radius:
    value: 11.0
  l-max:
    value: 6
  hidden-base-dim:
    value: 64
  hidden-irreps:
    value: 128x0e+16x0o+8x1e+64x1o+24x2e+8x2o+8x3e+24x3o+16x4e+4x4o+4x5e+12x5o+8x6e
  edge-type-emb-dim:
    value: 32
  emb-use-odd-features:
    value: true
  edge-encoder-style:
    value: rich
  edge-encoder-use-sh-tensor-square:
    value: true
  e3layernorm:
    value: false
  num-layers-gnn:
    value: 2
  tp-type:
    value: separate_weight
  use-self-connection:
    value: false
  edge-update-node-combine:
    value: concat
  edge-update-residual:
    value: false
  node-update-message-agg:
    value: attention
  node-update-attention-scalar-dim:
    value: 64
  node-update-attention-heads:
    value: 4
  node-update-residual:
    value: false

  # E3MLP / head architecture
  e3mlp-variant:
    value: film
  internal-e3mlp-variant:
    value: resnormact
  head-e3mlp-variant:
    value: normact
  neck-depth:
    value: 2
  internal-e3mlp-layers:
    value: 1
  head-e3mlp-layers:
    value: 1
  head-use-node-embeddings-for-self-edges:
    value: true
  separate-shifted-self:
    value: true
  head-use-tensor-square:
    value: false
  head-use-mlp-log-scale:
    value: false
  head-log-scale-mlp-n-layers:
    value: 1
  head-diag-output-scale:
    value: 1.0
  head-offdiag-output-scale:
    value: 1.0
  e3mlp-pre-norm:
    value: false
  e3mlp-norm-eps:
    value: 1e-8
  e3mlp-film-hidden-dim:
    value: 64
  e3mlp-output-scale:
    value: 1.0
  e3mlp-weight-init-scale:
    value: 1.0
  e3mlp-residual-scale:
    value: 0.25

  # Activations / regularization
  activation-odd-scalar:
    value: tanh
  activation-odd-gate:
    value: tanh
  nonlin-kind:
    value: normact
  activation-scalar:
    value: leakyrelu
  activation-gate:
    value: softplus
  s2act-res:
    value: 128
  norm-kind:
    value: component
  dropout:
    value: 0.0
  l1-reg-coef:
    value: 0.0
  l2-reg-coef:
    value: 0.0
  n-radial:
    value: 128
  radial-layers:
    value: [128, 128, 128]
  pair-conditioned-radial-mlp:
    value: false
  pair-distance-normalization:
    value: "off"

  # Runtime
  device:
    value: cuda
  gpus:
    value: 1
  benchmark:
    value: false
  adaptive-log-interval:
    value: true
  log-interval:
    value: 10

  # Logging
  log-data:
    value: false
  log-model:
    value: false
  log-forward:
    value: false
  log-per-irrep-metrics:
    value: true
  print-per-irrep-metrics:
    value: false
  log-per-irrep-images:
    value: false
  log-hamiltonian-irrep-contrib-metrics:
    value: true
  log-hamiltonian-pair-contrib-metrics:
    value: true
  log-partial-gt-observables:
    value: true

  # Targets / evaluation
  matrix-targets:
    value: [hamiltonian]
  enable-energy:
    value: true
  enable-num-electrons:
    value: true
  enable-forces:
    value: false
  train-on-energy:
    value: false
  train-on-num-electrons:
    value: false
  train-on-forces:
    value: false
  train-on-irrep-parts:
    value: false
  train-observables-on-gt:
    value: false
  loss-coef-observables:
    value: 0.0
  loss-coef-forces:
    value: 0.0
  symmetrize-output:
    value: false
  symmetrize-hamiltonian-targets:
    value: true
  rescale-density-to-num-electrons:
    value: false
  precompute-edge-features:
    value: true
  radial-embedding-scale:
    value: none
  apply-cutoff-to-targets:
    value: true
  require-exact-edge-match:
    value: true
  allow-incomplete-dataset:
    value: false

  # Envelope / physical output mode: match the source checkpoint
  hamiltonian-envelope-path:
    value: eval_outputs/zncusnses_radial_fit_study/slater_soft_cutoff_envelope.json
  hamiltonian-envelope-mode:
    value: multiply_prediction
  loss-weighting-mode:
    value: "off"

  # Spectral fine-tuning axes
  spectral-loss-enabled:
    value: true
  spectral-loss-coef:
    distribution: log_uniform_values
    min: 0.002
    max: 0.2
  spectral-loss-kmesh:
    value: 2x2x2
  spectral-loss-window-ev:
    value: 10.0
  spectral-loss-taper-ev:
    value: 2.0
  spectral-loss-huber-delta-ev:
    values: [0.01, 0.02, 0.05, 0.1, 0.2]
  spectral-loss-overlap-psd-cleanup:
    value: true
  spectral-loss-overlap-jitter:
    value: false
  spectral-fermi-cache-path:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/ZnCuSnSeS/spectral_fermi_cache_cutoff11_k4x4x4_merged.pt
  freeze-backbone-train-heads-only:
    values: [true, false]

  # Restart behavior / seed
  revert-on-spike:
    value: true
  revert-monitor:
    value: val/loss_total
  revert-decay-patience:
    value: 4
  revert-decay-rate:
    value: 0.5
  revert-spike-factor:
    value: 2.0
  seed:
    value: 44

program: scripts/wandb_run.py
method: bayes
metric:
  name: val/loss_total
  goal: minimize
command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
parameters:
  resume-from-wandb:
    value: https://wandb.ai/b-brzoza/mandala-matrices/runs/e9yo3gkj
  fork-run:
    value: true
  resume-mode:
    value: latest
  wandb-mode:
    value: online
  checkpoint-dir:
    value: checkpoints/restarts_from_e9yo3gkj
  max-epochs:
    value: 400
  num-train:
    value: 2000
  num-val:
    value: 200
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.1

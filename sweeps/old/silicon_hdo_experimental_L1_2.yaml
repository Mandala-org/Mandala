program: scripts/train_silicon.py
project: mandala_small_steps
name: silicon_hdo_overfit_l1_2
method: bayes
early_terminate:
  type: hyperband
  min_iter: 200  # Stop runs that are performing poorly after 200 epochs
metric:
  name: val_abs_error_E
  goal: minimize


parameters:
  cutoff_gnn:
    value: 7.0
  cutoff_matrix:
    value: 7.0
  l_max:
    values:
    - 4
    - 5
  l_max_matrix:
    values:
    - 5
    - 6
  num_layers_gnn:
    values:
    - 1
    - 2
    - 3
  num_layers_matrix:
    value: 1
  edge_update_linear:
    value: "pre"
  edge_update:
    value: "concat"
  edge_update_residual:
    value: True
  head_use_mlp_log_scale:
    values:
    - True
    - False
  nonlin_kind:
    value: "normact"
  activation_scalar:
    value: "leakyrelu"
  activation_gate:
    value: "leakyrelu"
  lr:
    distribution: log_uniform_values
    min: 1.0e-3
    max: 1.0e-1
  loss_coef_observables:
    distribution: log_uniform_values
    min: 1.0e-8
    max: 1.0e-5
  loss_coef_observables:
    distribution: log_uniform_values
    min: 1.0e-8
    max: 1.0e-5
  loss_l1_fraction:
    values:
      - 0.0
      - 0.5
      - 0.8
      - 1.0

  hidden_base_dim:
    value: 64
  dropout:
    value: 0.0
  n_radial:
    value: 128
  neck_depth:
    values:
    - 1
    - 2
    - 3
  head_depth:
    values:
    - 1
    - 2
    - 3
  train_target:
    value: "matrix"
  matrix_targets:
    value: ["hamiltonian", "density", "overlap"]


command:
  - ${env}
  - python3
  - -u # Unbuffered output for real-time logging
  - ${program}
  - ${args}
  - --gpus=1  # Specify a single GPU
  - --num_workers=20
  - --n_snapshots_per_temp=20 # Use a subset for faster sweeps
  - --val_n_snapshots=5
  - --max_epochs=1000
  - --val_temp=300
  - --min_temp=300
  - --max_temp=300

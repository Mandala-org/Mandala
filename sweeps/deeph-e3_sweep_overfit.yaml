program: scripts/train_silicon_deephe3.py
method: bayes
project: mandala_deephe3
metric:
  name: train/hamiltonian_mae
  goal: minimize
parameters:
  num_block:
    distribution: int_uniform
    min: 2
    max: 4
  r_max:
    distribution: uniform
    min: 6.0
    max: 8.0
  num_basis:
    values: [64, 128]
  use_sc:
    values: [true, false]
  use_sbf:
    values: [true, false]
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  lr_scheduler_target:
    value: "train/hamiltonian_mae"

command:
  - ${env}
  - python3
  - -u # Unbuffered output for real-time logging
  - ${program}
  - ${args}
  - --gpus=1  # Specify a single GPU
  - --num_workers=0
  - --n_snapshots_per_temp=1 # Use a subset for faster sweeps
  - --val_n_snapshots=0
  - --max_epochs=4000
  - --min_temp=300
  - --max_temp=300

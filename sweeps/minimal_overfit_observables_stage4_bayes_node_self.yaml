program: studies/minimal_overfit_observables/overfit_observables_minimal.py
project: mandala-minimal-overfit-observables-stages
name: minimal_overfit_observables_stage4_bayes_node_self
method: bayes
metric:
  name: mae_H
  goal: minimize

parameters:
  # Swept parameters (medium breadth)
  lr:
    distribution: log_uniform_values
    min: 1e-3
    max: 1e-2
  loss-coef-observables:
    distribution: log_uniform_values
    min: 1e-7
    max: 1e-3
  hidden-irreps:
    values:
      - "32x0e+32x1e+32x1o+16x2e+16x2o+16x3e+16x3o+8x4e"
  n-radial:
    values: [16, 32, 64]
  cutoff-radius:
    values: [7.0]
  num-layers:
    values: [1, 2, 3]

  # Fixed explicit parameters (stage-4 defaults + node-self head path)
  data-path:
    value: data/small/H2O/original/H2O.matrix
  info-path:
    value: data/small/H2O/original/H2O.info.out
  training-unit:
    value: ev
  matrix-targets:
    value: hamiltonian,overlap,density
  enable-energy:
    value: true
  enable-num-electrons:
    value: true
  train-on-energy:
    value: true
  train-on-num-electrons:
    value: true
  enable-forces:
    value: true
  train-on-forces:
    value: false
  loss-coef-forces:
    value: 0.0
  symmetrize-preds:
    value: true
  hidden-dim:
    value: 32
  l-max:
    value: 4
  num-epochs:
    value: 16000
  log-interval:
    value: 100
  device:
    value: cuda
  dtype:
    value: float32
  checkpoint-dir:
    value: studies/minimal_overfit_observables/checkpoints
  grad-clip:
    values: [1.0, 0.0]
  lr-factor:
    value: 0.2
  lr-patience:
    value: 400
  e3layernorm:
    values: [true, false]
  separate-shifted-self:
    value: true
  edge-encoder-use-sh-tensor-square:
    value: true
  head-use-tensor-square:
    value: true
  radial-embedding-scale:
    value: none
  head-e3mlp-layers:
    values: [1, 2, 3]
  head-use-node-embeddings-for-self-edges:
    value: true

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --adaptive-log-interval
  - --log-data
  - --log-model
  - --log-per-irrep-metrics
  - --log-per-irrep-images
  - --benchmark
  - --generate-video
  - --apply-cutoff-to-targets
  - --require-exact-edge-match
  - ${args}

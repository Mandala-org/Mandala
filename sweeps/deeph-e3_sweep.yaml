program: scripts/train_silicon_deephe3.py
method: bayes
metric:
  name: val/loss
  goal: minimize
parameters:
  num_block:
    distribution: int_uniform
    min: 2
    max: 4
  r_max:
    distribution: uniform
    min: 6.0
    max: 8.0
  num_basis:
    values: [64, 128]
  use_sc:
    values: [true, false]
  use_sbf:
    values: [true, false]
  lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-3

command:
  - ${env}
  - python3
  - -u # Unbuffered output for real-time logging
  - ${program}
  - ${args}
  - --gpus=1  # Specify a single GPU
  - --num_workers=0
  - --n_snapshots_per_temp=100 # Use a subset for faster sweeps
  - --max_epochs=1000
  - --min_temp=3000
  - --max_temp=3000

program: scripts/wandb_run.py
method: bayes
metric:
  name: val/energy_mae_gt_density
  goal: minimize

project: mandala-ZnCuSnSeS-hdo-rosi
command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
parameters:
  # Experiment metadata
  wandb-project:
    value: mandala-ZnCuSnSeS-hdo-rosi
  checkpoint-dir:
    value: checkpoints/ZnCuSnSeS
  resume-mode:
    value: latest
  wandb-mode:
    value: online

  # Dataset
  dataset-kind:
    value: ZnCuSnSeS
  data-path:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/ZnCuSnSeS
  snapshot-cache-dir:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/ZnCuSnSeS/snapshot_cache
  dataset-device:
    value: cuda
  num-workers:
    value: 8
  scales:
    value: [1]
  num-train-per-scale:
    value: 10
  num-val-per-scale:
    value: 2

  # Optimization
  lr:
    distribution: log_uniform_values
    min: 0.001
    max: 0.1

  # Model architecture
  precision:
    value: float32-true
  convention:
    value: e3nn
  use-lr-scheduler:
    value: true
  cutoff-radius:
    value: 11.0
  l-max:
    value: 6
  hidden-base-dim:
    value: 64
  hidden-irreps:
    value: 64x0e+64x0o+32x1e+32x1o+16x2e+16x2o+16x3e+16x3o+16x4e+16x4o+8x5e+8x5o+8x6e+8x6o
  edge-type-emb-dim:
    value: 32
  emb-use-odd-features:
    value: true
  edge-encoder-style:
    value: distance
  edge-encoder-use-sh-tensor-square:
    value: false
  e3layernorm:
    value: false
  num-layers-gnn:
    values: [2, 3]
  tp-type:
    value: separate_weight
  use-self-connection:
    values: [true, false]
  edge-update-node-combine:
    value: concat
  edge-update-residual:
    values: [true, false]
  node-update-message-agg:
    value: sum
  node-update-residual:
    values: [true, false]
  head-use-mlp-log-scale:
    value: false

  internal-e3mlp-layers:
    values: [1, 2, 3]
  neck-depth:
    values: [1, 2, 3, 4]
  head-e3mlp-layers:
    values: [1, 2, 3, 4]

  head-use-node-embeddings-for-self-edges:
    values: [true, false]
  separate-shifted-self:
    value: true
  head-use-tensor-square:
    value: false
  head-log-scale-mlp-n-layers:
    value: 1
  e3mlp-variant:
    values:
      - film
      - normact
      - resnormact
  internal-e3mlp-variant:
    values:
      - film
      - normact
      - resnormact
  head-e3mlp-variant:
    values:
      - film
      - normact
      - resnormact
  e3mlp-pre-norm:
    value: false
  e3mlp-norm-eps:
    value: 1e-8
  e3mlp-film-hidden-dim:
    value: 64
  activation-odd-scalar:
    value: tanh
  activation-odd-gate:
    value: tanh
  nonlin-kind:
    value: normact
  activation-scalar:
    value: leakyrelu
  activation-gate:
    value: softplus
  s2act-res:
    value: 128
  norm-kind:
    value: component
  dropout:
    value: 0.0
  l1-reg-coef:
    value: 0.0
  l2-reg-coef:
    value: 0.0
  grad-clip-val:
    value: 1
  accumulate-grad-batches:
    value: 1
  n-radial:
    value: 128
  radial-layers:
    value: [128, 128, 128]
  device:
    value: cuda
  gpus:
    value: 1
  benchmark:
    value: true
  adaptive-log-interval:
    value: true
  log-interval:
    value: 10
  log-data:
    value: true
  log-model:
    value: true
  log-forward:
    value: false
  log-per-irrep-metrics:
    value: true
  print-per-irrep-metrics:
    value: true
  log-per-irrep-images:
    value: true
  matrix-targets:
    value: hamiltonian,density,overlap
  enable-energy:
    value: true
  enable-num-electrons:
    value: true
  enable-forces:
    value: false
  train-on-energy:
    value: false
  train-on-num-electrons:
    value: false
  train-on-forces:
    value: false
  train-observables-on-gt:
    value: false
  log-partial-gt-observables:
    value: true
  loss-coef-observables:
    value: 0.0
  loss-coef-forces:
    value: 0.0
  symmetrize-output:
    value: false
  apply-cutoff-to-targets:
    value: true
  require-exact-edge-match:
    value: true
  precompute-edge-features:
    value: true
  radial-embedding-scale:
    value: none

  # Loss spike recovery
  revert-on-spike:
    value: true
  revert-monitor:
    value: val/loss_total
  revert-decay-patience:
    value: 4
  revert-decay-rate:
    value: 0.8
  revert-spike-factor:
    value: 2.0

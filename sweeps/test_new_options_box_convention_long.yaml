program: studies/minimal_overfit_study/overfit_water_minimal.py
project: mandala-test-variants
name: test_variants_box_convention_long_fixed
method: grid

parameters:
  # Data parameters
  data-path:
    value: "data/small/H2O/original/H2O.matrix"
  info-path:
    value: "data/small/H2O/original/H2O.info.out"
  convention:
    values: ["e3nn", "openmx"]
  xyz-permutation:
    values: ["012", "120", "201"]
  change-box:
    values: ["left", "right", "both"]
  box-convention:
    values: ["rows", "cols"]

  # Network architecture parameters
  l-max:
    value: 4
  hidden-irreps:
    value: 32x0e+32x0o+16x1e+16x1o+16x2e+16x2o+8x3e+8x3o+8x4e+8x4o
  num-layers:
    value: 2
  cutoff-radius:
    value: 7.0
  n-radial:
    value: 64

  # Training parameters
  lr:
    value: 0.01
  num-epochs:
    value: 40000
  log-interval:
    value: 200
  grad-clip:
    value: 1.0
  lr-factor:
    value: 0.5
  lr-patience:
    value: 1000

  # Device and checkpointing
  device:
    value: "cuda"
  checkpoint-dir:
    value: "studies/minimal_overfit_study/checkpoints"


command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --generate-video
  - --normalize-blocks
  - --generate-video
  - --adaptive-log-interval
  - ${args}

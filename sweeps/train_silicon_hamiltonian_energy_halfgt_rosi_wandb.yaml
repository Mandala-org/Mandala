program: scripts/wandb_run.py
method: bayes
metric:
  name: val/energy_mae_gt_density
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 40
  eta: 3
command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}
parameters:
  wandb-project:
    value: mandala-minimal-silicon-hamiltonian-energy-halfgt-rosi
  data-path:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A
  snapshot-cache-dir:
    value: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/snapshot_cache
  checkpoint-dir:
    value: checkpoints/silicon
  dataset-device:
    value: cpu
  num-workers:
    value: 8
  min-temp:
    value: 3000
  max-temp:
    value: 3000
  temp-step:
    value: 300
  n-snapshots-per-temp:
    value: 12
  val-temp:
    value: 3000
  val-n-snapshots:
    value: 2
  matrix-targets:
    value: hamiltonian
  enable-energy:
    value: true
  enable-num-electrons:
    value: false
  train-on-energy:
    value: true
  train-on-num-electrons:
    value: false
  train-observables-on-gt:
    value: true
  log-partial-gt-observables:
    value: true
  loss-coef-observables:
    values:
      - 1.0e-9
      - 1.0e-8
      - 1.0e-7
      - 1.0e-6
  enable-forces:
    value: false
  train-on-forces:
    value: false
  loss-coef-forces:
    value: 0.0
  symmetrize-output:
    value: false
  hidden-irreps:
    value: 32x0e+32x0o+16x1e+16x1o+8x2e+8x2o+8x3e+8x3o+8x4e
  hidden-base-dim:
    value: 32
  l-max:
    value: 4
  num-layers-gnn:
    values:
      - 2
      - 3
  n-radial:
    value: 64
  cutoff-radius:
    value: 7.5
  edge-encoder-style:
    values:
      - rich
      - distance
  e3layernorm:
    values:
      - true
      - false
  separate-shifted-self:
    value: true
  edge-encoder-use-sh-tensor-square:
    values:
      - true
      - false
  radial-embedding-scale:
    value: none
  apply-cutoff-to-targets:
    value: true
  require-exact-edge-match:
    value: true
  precompute-edge-features:
    value: true
  dtype:
    value: float32
  device:
    value: cuda
  gpus:
    value: 1
  grad-clip-val:
    values:
      - 1.0
      - 0.0
  accumulate-grad-batches:
    value: 1
  lr-scheduler-factor:
    value: 0.2
  lr-scheduler-patience:
    value: 100
  max-epochs:
    value: 500
  log-interval:
    value: 10
  adaptive-log-interval:
    value: true
  benchmark:
    value: true
  log-data:
    value: true
  log-model:
    value: true
  log-forward:
    value: false
  log-per-irrep-metrics:
    value: true
  print-per-irrep-metrics:
    value: true
  log-per-irrep-images:
    value: true
  generate-video:
    value: true
  num-train:
    value: 10
  num-val:
    value: 2
  lr:
    values:
      - 0.0003
      - 0.001
      - 0.003
      - 0.01
      - 0.03
  head-use-tensor-square:
    values:
      - false
      - true
  head-use-node-embeddings-for-self-edges:
    values:
      - false
      - true
  head-e3mlp-layers:
    values:
      - 1
      - 2
      - 3
  internal-e3mlp-layers:
    values:
      - 1
      - 2
      - 3
  head-e3mlp-variant:
    values:
      - gatemagnitudes
      - gate
      - normact
      - resgatemagnitudes
      - resnormact
      - film
  internal-e3mlp-variant:
    values:
      - resgatemagnitudes
      - gatemagnitudes
      - gate
      - normact
      - resnormact
      - film
  e3mlp-pre-norm:
    values:
     - true
     - false
  e3mlp-output-scale:
    values:
      - 0.25
      - 0.5
      - 1.0
  e3mlp-weight-init-scale:
    values:
      - 0.1
      - 0.25
      - 0.5
  e3mlp-residual-scale:
    values:
      - 0.02
      - 0.05
      - 0.1
  e3mlp-film-hidden-dim:
    value: 64
  init-weights-factor:
    values:
      - 1
      - 0.1
      - 0.01
  head-diag-output-scale:
    values:
      - 0.5
      - 1.0
      - 2.0
  head-offdiag-output-scale:
    values:
      - 0.03
      - 0.05
      - 0.1
      - 0.2

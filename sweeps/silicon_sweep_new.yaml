program: scripts/train_silicon.py
project: mandala_deephe3
name: deephe3_silicon_architecture_test
method: bayes
early_terminate:
  type: hyperband
  min_iter: 200  # Stop runs that are performing poorly after 200 epochs
metric:
  name: train/loss_total
  goal: minimize

parameters:
  # ============ NEW DeepH-E3 Architecture Parameters ============

  # TensorProduct type
  tp_type:
    values: ["separate_weight", "fully_connected"]

  # Self-connection (element-specific features)
  use_self_connection:
    values: [True, False]

  # ============ Core Architecture ============

  # Single unified cutoff (no more cutoff_gnn/cutoff_matrix split)
  cutoff_matrix:
    values: [6.0, 7.0, 8.0]

  # Irreps configuration
  l_max:
    value: 4
  l_max_matrix:
    value: 4
  hidden_base_dim:
    values: [16, 32]
  emb_use_odd_features:
    value: True  # Use odd features for full E(3) coverage

  # Number of layers (unified, no more small/large split)
  num_layers_gnn:
    values: [1, 2, 3]

  # ============ Message-Passing Variants ============

  # Keep simple DeepH-E3 defaults
  node_update_message_agg:
    value: "sum"  # DeepH-E3 uses simple sum aggregation

  edge_update_residual:
    value: True

  node_update_residual:
    value: True

  # ============ Network Details ============

  # Radial basis
  n_radial:
    values: [64, 128]
  radial_layers:
    value: [128]  # Single hidden layer in radial MLP

  # Head configuration
  neck_depth:
    values: [1, 2, 3]
  head_depth:
    value: 1
  head_use_mlp_log_scale:
    value: False

  # Nonlinearity
  nonlin_kind:
    value: "normact"
  activation_scalar:
    value: "silu"
  activation_gate:
    value: "sigmoid"
  norm_kind:
    value: "component"

  # ============ Training Configuration ============

  # Learning rate
  lr:
    distribution: log_uniform_values
    min: 5.0e-5
    max: 1.0e-3

  # LR scheduler
  use_lr_scheduler:
    value: True
  lr_scheduler_factor:
    value: 0.5
  lr_scheduler_patience:
    value: 60
  lr_scheduler_target:
    value: "train/loss_total"

  # Regularization
  dropout:
    values: [0.0, 0.1]

  # Loss configuration
  train_target:
    value: "matrix"
  loss_l1_fraction:
    value: 0.0  # Pure L2 loss

  # ============ Training Targets ============

  # Matrix targets
  matrix_targets:
    value: ["hamiltonian"]

  # Observables (disabled for pure matrix overfitting)
  train_on_energy:
    value: False
  train_on_num_electrons:
    value: False
  enable_energy:
    value: False
  enable_num_electrons:
    value: False
  loss_coef_observables:
    value: 0.0

  # Forces and stress (disabled)
  train_on_forces:
    value: False
  train_on_stress:
    value: False
  enable_forces:
    value: False
  enable_stress:
    value: False

  # ============ Data Configuration ============

  # Symmetrization
  symmetrize_output:
    value: True

  # Edge feature precomputation
  precompute_edge_features:
    value: True

  # Safety checks (disable for speed)
  safety_checks:
    value: False

command:
  - ${env}
  - python3
  - -u  # Unbuffered output for real-time logging
  - ${program}
  - ${args}
  - --gpus=1
  - --num_workers=4
  - --n_snapshots_per_temp=1  # Small dataset for fast iteration
  - --val_n_snapshots=0  # Overfitting mode
  - --max_epochs=2000
  - --min_temp=300
  - --max_temp=300
  - --batch_size=1
  - --accumulate_grad_batches=1
  - --log_every_n_steps=10

program: scripts/train_silicon.py
project: mandala_rebirth
name: silicon_hamiltonian_overfit_small
method: bayes
early_terminate:
  type: hyperband
  min_iter: 100  # Stop runs that are performing poorly after 100 epochs
metric:
  name: train/loss_total
  goal: minimize


parameters:
  cutoff_gnn:
    value: 7.5
  cutoff_matrix:
    value: 7.5
  l_max_gnn:
    value: 4
  l_max_matrix:
    value: 4
  hidden_base_dim:
    value: 16
  use_odd_features:
    value: False
  num_layers_gnn:
    value: 0
  num_layers_matrix:
    value: 1
  edge_update_linear:
    values: ["pre", "post"]
  edge_update:
    values: ["concat"]
  edge_update_residual:
    values: [True]
  head_use_mlp_log_scale:
    values: [False]
  nonlin_kind:
    value: "normact"
  activation_scalar:
    values: ["silu", "leakyrelu", "tanh"]
  activation_gate:
    values: ["sigmoid", "leakyrelu", "tanh"]
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 1.0e-3
  lr_scheduler_factor:
    value: 0.5
  lr_scheduler_patience:
    value: 60
  dropout:
    value: 0.0
  n_radial:
    value: 16
  neck_depth:
    value: 0
  head_depth:
    value: 1
  train_target:
    value: "matrix"

  # --- Fixed parameters for Hamiltonian-only training ---
  matrix_targets:
    value: ["hamiltonian"]
  train_on_energy:
    value: False
  train_on_num_electrons:
    value: False
  loss_coef_observables:
    value: 0.0

  # --- Overfitting settings ---
  lr_scheduler_target:
    value: "train/loss_total"


command:
  - ${env}
  - python3
  - -u # Unbuffered output for real-time logging
  - ${program}
  - ${args}
  - --gpus=1  # Specify a single GPU
  - --num_workers=0
  - --n_snapshots_per_temp=1 # Use a subset for faster sweeps
  - --val_n_snapshots=0
  - --max_epochs=1000
  - --min_temp=300
  - --max_temp=300

# Medium GPU preset: medium-sized GPU training on silicon dataset_A
data:
  snapshots:
    - matrix: /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/300K/0/Si_DM
      info:   /bigdata/casus/wdm/hamiltonian_learning/data/silicon_very_big/dataset_A/300K/0/info.dat
      purpose: train
  cutoff_gnn:     4.0
  cutoff_matrix:  6.0
  l_max_sh:       3
  n_radial:       64
  num_workers:    8
training:
  lr:           3e-4
  max_epochs:   10
  precision:    32
  log_every_n_steps: 4
  gpus:         1
model: {}
logging:
  run_name:      "silicon_medium_gpu_benchmark"
  wandb_project: "e3gnn_silicon"

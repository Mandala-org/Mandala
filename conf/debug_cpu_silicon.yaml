# Debug CPU preset: small data subset for quick testing on CPU
dataset:
  snapshots:
    - matrix: data/big/silicon/900K/Si_DM
      info:   data/big/silicon/900K/info.txt
      purpose: train
    - matrix: data/big/silicon/2700K/Si_DM
      info:   data/big/silicon/2700K/info.txt
      purpose: val

config:
  # data:
  cutoff_radius: 6.0
  n_radial: 64

  # training:
  lr: 3e-4
  max_epochs: 3
  precision: 32
  gpus: cpu
  num_workers: 0
  tune: null
  seed: 42
  log_every_n_steps: 1
  smoke_test: false

  # model:
  hidden_base_dim: 32
  l_max: 2
  num_layers_gnn: 2
  dropout: 0.0
  l1_reg_coef: 0.0
  l2_reg_coef: 0.0
  grad_clip_val: 0.0
  loss_coef_observables: 0.0001

  # logging:
  run_name: "debug-cpu-silicon"
  verbosity: 2
  bench_verbosity: 1
  log_activation_mag: true
  wandb_project: null

# Debug CPU preset: small data subset for quick testing on CPU

dataset:
  snapshots:
    - matrix: data/small/H2O/original/H2O.matrix
      info:   data/small/H2O/original/H2O.info.out
      purpose: train
    - matrix: data/small/H2O/rotated/H2O.matrix
      info:   data/small/H2O/rotated/H2O.info.out
      purpose: val

config:
  # data:
  cutoff_radius: 8.0
  n_radial: 64
  num_workers: 0
  enable_forces: false
  enable_stress: false

  # training:
  lr: 3e-4
  batch_size: 1
  max_epochs: 3
  dtype: float32
  gpus: mps
  tune: None
  seed: 42
  log_every_n_steps: 1
  smoke_test: false

  # model:
  hidden_base_dim: 32
  l_max: 2
  num_layers_gnn: 2
  dropout: 0.0
  l1_reg_coef: 0.0
  l2_reg_coef: 0.0
  grad_clip_val: 0.0
  loss_coef_observables: 0.0001
  loss_coef_forces: 0.0
  loss_coef_stress: 0.0
  train_on_forces: false
  train_on_stress: false
  train_on_energy: true
  train_on_num_electrons: true

  # logging:
  run_name: "debug-cpu-small"
  verbosity: 2
  bench_verbosity: 1
  log_activation_mag: true
  wandb_project: null
  safety_checks: false

## Debug CPU preset: small data subset for quick testing on CPU
data:
  snapshots:
    - matrix: data/small/H2O/original/H2O.matrix
      info:   data/small/H2O/original/H2O.info.out
      purpose: train
    - matrix: data/big/silicon/900K/Si_DM
      info:   data/big/silicon/900K/info.txt
      purpose: train
    - matrix: data/big/silicon/2700K/Si_DM
      info:   data/big/silicon/2700K/info.txt
      purpose: val
  cutoff_gnn:     4.0
  cutoff_matrix:  6.0
  l_max_sh:       2
  n_radial:       64
  num_workers:    0
training:
  lr:           3e-4
  max_epochs:   3
  precision:    32
  gpus:         cpu
model:
  hidden_base_dim:   32
  num_layers_gnn:    2
  num_layers_matrix: 1
  dropout:           0.0
  energy_loss_coef:   0.0001
  electron_loss_coef: 0.0001
logging:
  run_name:        "debug-cpu-small"
  wandb_project:   null
